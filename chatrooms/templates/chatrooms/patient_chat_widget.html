<div id="patient-chat-widget-root">
  <!-- Кнопка открыть чат -->
  <button id="open-patient-chat-btn"
          type="button"
          class="btn btn-primary"
          style="position: fixed; bottom: 20px; right: 20px; z-index: 1050;">
    Open chat
  </button>

  <!-- Сам popup-чат -->
  <div id="patient-chat-popup"
       class="card shadow"
       style="position: fixed; bottom: 80px; right: 20px; width: 320px;
              max-height: 450px; display: none; z-index: 1050;">

    <div class="card-header d-flex justify-content-between align-items-center">
      <span id="patient-chat-title">Patient chat</span>
      <button type="button" id="close-patient-chat-btn" class="btn btn-sm btn-light">&times;</button>
    </div>

    <div class="card-body d-flex flex-column" style="padding: 8px; height: 350px;">
      <div id="patient-chat-messages"
           class="border rounded p-2 mb-2"
           style="overflow-y: auto; flex: 1; font-size: 0.9rem;">
        <!-- сообщения сюда -->
      </div>

      <!-- ⬇⬇⬇ ВОТ СЮДА ВСТАВЛЯЕМ ИНВАЙТ ⬇⬇⬇ -->
      <div class="chat-invite mt-2">
        <div class="input-group input-group-sm">
          <input type="text" id="invite-username"
                 class="form-control"
                 placeholder="Invite by username">
          <div class="input-group-append">
            <button class="btn btn-outline-secondary" id="invite-btn" type="button">
              Invite
            </button>
          </div>
        </div>
      </div>
      <!-- ⬆⬆⬆ КОНЕЦ ИНВАЙТА ⬆⬆⬆ -->

      <form id="patient-chat-form" class="mt-2">
        <div class="input-group input-group-sm">
          <input type="text" id="patient-chat-input" class="form-control" placeholder="Type a message...">
          <div class="input-group-append">
            <button class="btn btn-primary" type="submit">Send</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
