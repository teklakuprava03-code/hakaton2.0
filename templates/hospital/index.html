<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedAI Platform</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #f5f9ff 0%, #eef4ff 100%);
            color: #1a1a1a;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #626d83;
            font-size: 20px;
            margin-bottom: 50px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 300px;
            padding: 35px 25px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .icon-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #2e6ff2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icon-circle img {
            width: 35px;
            height: 35px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-subtitle {
            color: #7c869c;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #2e6ff2;
            padding: 10px 25px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 17px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1c56d4;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>MedAI Platform</h1>
        <div class="subtitle">
            Эффективная и безопасная коммуникация для медицинского персонала<br>
            с поддержкой искусственного интеллекта
        </div>

        <div class="cards">

            <!-- ADMIN -->
            <div class="card">
                <div class="icon-circle">
                    <img src="https://img.icons8.com/ios-filled/50/ffffff/administrator-male.png"/>
                </div>
                <div class="card-title">Администратор</div>
                <div class="card-subtitle">Управление системой</div>
                <a class="btn" href="/adminlogin">Войти</a>
            </div>

            <!-- DOCTOR -->
            <div class="card">
                <div class="icon-circle">
                    <img src="https://img.icons8.com/ios-filled/50/ffffff/doctor-male.png"/>
                </div>
                <div class="card-title">Доктор</div>
                <div class="card-subtitle">Врачи, медсёстры, санитары</div>
                <a class="btn" href="/doctorlogin">Войти</a>
            </div>

            <!-- PATIENT -->
            <div class="card">
                <div class="icon-circle">
                    <img src="https://img.icons8.com/ios-filled/50/ffffff/hospital-bed.png"/>
                </div>
                <div class="card-title">Пациент</div>
                <div class="card-subtitle">Доступ для пациентов</div>
                <a class="btn" href="/patientlogin">Войти</a>
            </div>

        </div>
    </div>
</body>
</html>
